<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xiao Fang | Quantitative Researcher, Cosmologist, Stargazer</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #1c1c1c;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
      position: relative;
      z-index: 0;
      overflow-x: hidden;
      overflow-y: auto;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    img {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 3rem;
      font-weight: 600;
      margin: 0.75rem 0;
    }
    p {
      font-size: 1.3rem;
      margin: 0.75rem auto 2rem;
      line-height: 1.8;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }
    .links a {
      text-decoration: none;
      color: #004080;
      font-weight: 500;
      padding: 0.4rem 0.8rem;
      border: 1px solid #004080;
      border-radius: 6px;
      transition: background 0.2s ease;
    }
    .links a:hover {
      background: #004080;
      color: white;
    }
    body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('images/background.jpg') no-repeat center center / cover;
    opacity: 0.3;
    z-index: -2;
    filter: grayscale(1) invert(1) brightness(1.2);
  }

  .dark-mode::before {
    filter: grayscale(1) brightness(1.2);
  }
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.2); /* soft white tint */
    z-index: -1;
  }
  .dark-mode {
    background-color: #121212;
    color: #f0f0f0;
  }

  .dark-mode .links a {
    color: #f0f0f0;
    border-color: #f0f0f0;
  }

  .dark-mode .links a:hover {
    background: #f0f0f0;
    color: #121212;
  }

  .toggle-button {
    position: fixed;
    top: 1rem;
    right: 1rem;
    background: #f0f0f0;
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 0.5rem 1rem;
    cursor: pointer;
    z-index: 10;
  }

  .dark-mode .toggle-button {
    background: #333;
    color: #fff;
  }
  @media (max-width: 600px) {
    img {
      width: 180px;
      height: 180px;
    }
    h1 {
      font-size: 2rem;
    }
    p {
      font-size: 1rem;
    }
  }
</style>
</head>
<body>
  <button class="toggle-button" id="modeToggle" onclick="toggleDarkMode()">Dark Mode</button>
  <div class="overlay"></div>
  <main>
    <img src="images/headshot.jpg" alt="Xiao Fang" />
    <h1>Xiao Fang</h1>
    <p>Quantitative Researcher, Cosmologist, Stargazer</p>
    <div class="links">
      <a href="https://www.linkedin.com/in/xiao-fang-b810b038/" target="_blank">LinkedIn</a>
      <a href="https://github.com/xfangcosmo" target="_blank">GitHub</a>
      <a href="https://scholar.google.com/citations?user=l2A8nX0AAAAJ" target="_blank">Google Scholar</a>
      <a href="https://inspirehep.net/authors/1429708?ui-citation-summary=true" target="_blank">Inspire-HEP</a>
    </div>
  </main>
<script>
  // Initialize theme based on user preference or system setting
  const userPref = localStorage.getItem('theme');
  const systemPref = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if ((userPref === 'dark') || (!userPref && systemPref)) {
    document.body.classList.add('dark-mode');
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('modeToggle').textContent = 'Light Mode';
    });
  } else {
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('modeToggle').textContent = 'Dark Mode';
    });
  }

  function toggleDarkMode() {
    const isDark = document.body.classList.toggle('dark-mode');
    const mode = isDark ? 'dark' : 'light';
    localStorage.setItem('theme', mode);
    document.getElementById('modeToggle').textContent = isDark ? 'Light Mode' : 'Dark Mode';
  }
</script>
</body>
</html>
